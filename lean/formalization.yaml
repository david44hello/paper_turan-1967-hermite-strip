  - Quot.sound
  - Classical.choice
automation:
  methods:
  - method: agent
    tool_setup: AI agents wrote Lean and carried out machine checks under the author’s direction.
fidelity:
  divergences: The analytic proof derives the closed-strip guarantee and equality case conditional on
    four supplied finite checks. The supplement establishes the numerical conditions. The sharpness counterexample
    is unconditional.
review:
  status: agent-reviewed
  reviewers:
  - OpenAI Codex
  notes: The independent OpenAI Codex check compared the selected theorem statements and assumptions with
    the published proof and paper. The paper release has a signed clean build, kernel replay, six export
    checks and standard and paranoid comparator results. The numerical certificates were replayed separately.
