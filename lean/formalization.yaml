version: v0.4
project:
  name: Sharp horizontal strips for Hermite quadrinomials
  description: For complex a and b and integers 2 ≤ n < m, a zero of 1 + 2z + aHₙ(z) + bHₘ(z) lies in
    the closed horizontal strip of half-width h = 0.903669747226… around the real axis, provided four
    finite certificate conditions hold. Under the same conditions, exactly two conjugate cubics avoid
    the open strip of that width. An explicit cubic proves, without certificate assumptions, that every
    smaller half-width fails.
  authors:
  - Dave Goel
  license: Apache-2.0
  responsible_maintainers:
  - Dave Goel
