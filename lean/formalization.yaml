status:
  scope: The three compared statements formalize the upper bound, a counterexample to every smaller width
    and the equality classification of Theorem 1. The upper bound and classification take TrinomialDiskCheck
    (G1), MiddleChecks, QuinticChartCheck (F1) and SexticChartCheck (E10) as explicit propositions. MiddleChecks
    uses the circle, ratio, transfer or winding tests for each eligible pair in its finite range. These
    predicates describe numerical inequalities. The supplement’s programs verify them outside Lean. The
    lower-bound witness uses only Lean’s three standard axioms.
  sorry_count: 0
  sorry_in_definitions: 0
